<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واجهة اختبار MAi Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
    .user { background: #007bff; align-self: flex-end; border-bottom-left-radius: 2px; }
    .bot { background: #2a2a2a; align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid #444; }
    .preview-img { max-width: 200px; border-radius: 8px; margin-top: 5px; display: block; }
    
    #controls { background: #1f1f1f; padding: 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .input-group { display: flex; gap: 10px; align-items: center; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: #fff; outline: none; }
    button { padding: 12px 18px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    
    #file-input { display: none; }
    .icon-btn { background: #333; padding: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: #444; }
    #image-preview-container { display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <h2>🧪 واجهة اختبار MAi Assistant</h2>
  </header>

  <div id="chat-box">
    <div class="message bot">مرحباً يا يحيى! اكتب أي رسالة لاختبار السيرفر والرد.</div>
  </div>

  <div id="controls">
    <div id="image-preview-container"></div>
    <div class="input-group">
      <label for="file-input" class="icon-btn" title="إرفاق صورة">📷</label>
      <input type="file" id="file-input" accept="image/*">

      <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." />
      <button id="send-btn">إرسال</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const imagePreviewContainer = document.getElementById('image-preview-container');

    let selectedImageBase64 = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          selectedImageBase64 = evt.target.result;
          imagePreviewContainer.innerHTML = `
            <span style="font-size: 12px;">صورة محددة:</span>
            <img src="${selectedImageBase64}" style="height: 40px; border-radius: 4px;">
            <button onclick="clearImage()" style="padding: 2px 6px; background: red; border:none; color:white; border-radius:4px; cursor:pointer;">X</button>
          `;
        };
        reader.readAsDataURL(file);
      }
    });

    function clearImage() {
      selectedImageBase64 = null;
      fileInput.value = '';
      imagePreviewContainer.innerHTML = '';
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text && !selectedImageBase64) return;

      let userHTML = text;
      if (selectedImageBase64) {
        userHTML += `<br><img src="${selectedImageBase64}" class="preview-img">`;
      }

      appendMessage('user', userHTML);

      const payload = {
        message: text,
        prompt: text, // نرسل الاثنين لضمان توافقها مع أي اسم يتوقعه السيرفر
        image: selectedImageBase64
      };

      userInput.value = '';
      clearImage();

      try {
        let response = null;
        let data = null;

        // نحاول الإرسال على المسار الأول /ask
        try {
          response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            data = await response.json();
          }
        } catch (e) {}

        // إذا لم ينجح /ask، نحاول على المسار البديل /chat
        if (!data) {
          response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (response.ok) {
            data = await response.json();
          }
        }

        if (data) {
          // استخراج الرد بأي صيغة محتملة يرجعها السيرفر
          const replyText = data.reply || data.answer || data.message || data.result || JSON.stringify(data);
          appendMessage('bot', replyText);
        } else {
          appendMessage('bot', '❌ تعذر الوصول لمسار الرد في السيرفر (تأكد من مسارات api.js).');
        }

      } catch (error) {
        appendMessage('bot', '❌ خطأ: ' + error.message);
      }
    }

    function appendMessage(sender, htmlContent) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerHTML = htmlContent;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>
</html>
